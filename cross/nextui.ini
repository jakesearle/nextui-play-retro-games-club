# One cross file for every NextUI handheld: Apostrophe resolves the platform at
# runtime, so PLATFORM_NEXTUI is the only platform define. cortex-a53 is the
# baseline all four implement.

[binaries]
c          = 'aarch64-nextui-linux-gnu-gcc'
cpp        = 'aarch64-nextui-linux-gnu-g++'
ar         = 'aarch64-nextui-linux-gnu-ar'
strip      = 'aarch64-nextui-linux-gnu-strip'
pkg-config = 'pkg-config'

[host_machine]
system     = 'linux'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'

[built-in options]
c_args = ['-mcpu=cortex-a53', '-mtune=cortex-a53', '-DPLATFORM_NEXTUI']
